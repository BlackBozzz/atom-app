<div class="factory-page-layout">
  <header class="toolbar">
    <div class="toolbar-title">Редактор инфраструктуры</div>
  </header>

  <main class="diagram-area">
    @if (ready()) {
      <ng-diagram [config]="config" [model]="model()" [nodeTemplateMap]="nodeTemplateMap">
        <ng-diagram-background />
      </ng-diagram>
    } @else if (layoutError()) {
      <p class="diagram-message">{{ layoutError() }}</p>
    } @else {
      <p class="diagram-message">Расстановка узлов…</p>
    }
  </main>
</div>
