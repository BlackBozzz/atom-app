<div class="building-node-card">
  <header class="building-node-header" [title]="nodeData().name">
    <svg class="building-node-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" [attr.d]="buildingIconPath()" />
    </svg>
    <span class="building-node-name">{{ nodeData().name }}</span>
  </header>

  <div class="building-node-resources">
    @for (resource of resources; track resource.id) {
      <div class="building-node-resource" [class.building-node-resource--water]="resource.id === 'water'">
        <ng-diagram-port
          class="building-node-port building-node-port--in"
          type="target"
          side="left"
          [id]="resource.input"
        />

        <div class="building-node-resource-title">{{ resource.label }}</div>
        <div class="building-node-statuses">
          @for (item of statuses; track item.id) {
            <svg
              class="building-node-status-icon"
              viewBox="0 0 24 24"
              role="img"
              [class.status-normal]="item.id === 'normal'"
              [class.status-emergency]="item.id === 'emergency'"
              [class.status-repair]="item.id === 'repair'"
              [class.status-active]="status(resource.id) === item.id"
              [attr.aria-label]="item.label"
              [attr.title]="item.label"
            >
              @switch (item.id) {
                @case ('normal') {
                  <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
                  <path d="m7.5 12 3 3 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('emergency') {
                  <path d="M12 3 22 20H2L12 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
                  <path d="M12 9v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                  <circle cx="12" cy="17" r="1" fill="currentColor" />
                }
                @case ('repair') {
                  <path d="m15 4 5 5M14 5l2-2 6 6-2 2M15 10 6 19a2 2 0 0 1-3-3l9-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                }
              }
            </svg>
          }
        </div>

        <ng-diagram-port
          class="building-node-port building-node-port--out"
          type="source"
          side="right"
          [id]="resource.output"
        />
      </div>
    }
  </div>
</div>
