<div class="district-group">
  <div class="district-header">
    <button
      type="button"
      class="collapse-btn"
      data-no-drag="true"
      data-no-pan="true"
      (click)="toggleCollapse($event)"
      [attr.aria-expanded]="!isCollapsed()"
      [title]="isCollapsed() ? 'Развернуть район' : 'Свернуть район'"
    >
      {{ isCollapsed() ? '▶' : '▼' }}
    </button>

    @if (nodeData().iconId) {
      <svg class="district-icon" aria-hidden="true">
        <use [attr.href]="'assets/icons.svg#' + nodeData().iconId"></use>
      </svg>
    }

    <span class="district-title">{{ nodeData().name }}</span>
    <span class="district-count">{{ childCount() }}</span>
  </div>

  @if (!isCollapsed()) {
    <div class="district-body"></div>
  }

  <ng-diagram-port id="port-water-in"       side="left"  type="target" class="gp gp-in  gp-water" />
  <ng-diagram-port id="port-electricity-in" side="left"  type="target" class="gp gp-in  gp-power" />
  <ng-diagram-port id="port-water-out"      side="right" type="source" class="gp gp-out gp-water" />
  <ng-diagram-port id="port-electricity-out" side="right" type="source" class="gp gp-out gp-power" />
</div>
