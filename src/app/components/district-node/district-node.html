<ng-diagram-node-resize-adornment [defaultResizable]="!isCollapsed()">
  <div
    ngDiagramGroupHighlighted
    ngDiagramNodeSelected
    class="district-group"
    [class.is-collapsed]="isCollapsed()"
    [node]="node()"
  >
    <div class="district-header">
      <button
        class="collapse-button"
        type="button"
        [disabled]="busy"
        [attr.aria-expanded]="!isCollapsed()"
        [title]="isCollapsed() ? 'Развернуть район' : 'Свернуть район'"
        (click)="toggleCollapse($event)"
      >{{ isCollapsed() ? '▸' : '▾' }}</button>
      <svg class="district-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" [attr.d]="districtIconPath()" />
      </svg>
      <span class="district-title">{{ nodeData().name }}</span>
    </div>

    @if (isCollapsed()) {
      <div class="district-resource">Водоснабжение</div>
      <div class="district-resource">Электроэнергия</div>
    } @else {
      <div class="district-body"></div>
    }

    <ng-diagram-port
      class="district-port district-port--water"
      id="port-water-in"
      side="left"
      type="target"
      [style.top]="'58%'"
      [hidden]="!isCollapsed()"
    />
    <ng-diagram-port
      class="district-port district-port--power"
      id="port-electricity-in"
      side="left"
      type="target"
      [style.top]="'85%'"
      [hidden]="!isCollapsed()"
    />
    <ng-diagram-port
      class="district-port district-port--water"
      id="port-water-out"
      side="right"
      type="source"
      [style.top]="'58%'"
      [hidden]="!isCollapsed()"
    />
    <ng-diagram-port
      class="district-port district-port--power"
      id="port-electricity-out"
      side="right"
      type="source"
      [style.top]="'85%'"
      [hidden]="!isCollapsed()"
    />
  </div>
</ng-diagram-node-resize-adornment>
