<ng-diagram-node-resize-adornment>
  <div
    class="district-group"
    ngDiagramGroupHighlighted
    ngDiagramNodeSelected
    [node]="node()"
  >
    <div class="district-header">
      <button
        class="collapse-btn"
        (click)="toggleCollapse($event)"
        [title]="isCollapsed() ? 'Развернуть' : 'Свернуть'"
      >
        {{ isCollapsed() ? '▶' : '▼' }}
      </button>

      @if (nodeData().iconId) {
        <svg class="district-icon" aria-hidden="true">
          <use [attr.href]="'assets/icons.svg#' + nodeData().iconId"></use>
        </svg>
      }

      <span class="district-title">{{ nodeData().name }}</span>
    </div>

    @if (!isCollapsed()) {
      <div class="district-body"></div>
    }

    <!-- 4 порта — в точности как у дочерних узлов -->
    <ng-diagram-port
      id="port-water-in"
      side="left"
      type="target"
      class="port-water-in"
    />
    <ng-diagram-port
      id="port-electricity-in"
      side="left"
      type="target"
      class="port-power-in"
    />
    <ng-diagram-port
      id="port-water-out"
      side="right"
      type="source"
      class="port-water-out"
    />
    <ng-diagram-port
      id="port-electricity-out"
      side="right"
      type="source"
      class="port-power-out"
    />
  </div>
</ng-diagram-node-resize-adornment>
